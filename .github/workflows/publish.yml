name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs Node >= 22.14 and npm >= 11.5.1
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Show npm / node versions
        run: |
          node -v
          npm -v

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag version ($TAG) must match package.json version ($PKG)"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          # Optional fallback if Trusted Publishing is not configured yet.
          # Prefer OIDC: leave NPM_TOKEN unset after enabling Trusted Publisher on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
